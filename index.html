<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>Meri Free AI Website</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        input { padding: 10px; width: 300px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; font-size: 18px; color: #333; }
    </style>
</head>
<body>

    <h1>🤖 Meri AI Web Application</h1>
    <p>Yahan apna sawal likhein:</p>
    
    <input type="text" id="userInput" placeholder="Kuch poochhein...">
    <br><br>
    <button onclick="runAI()">Jawab Hasil Karein</button>

    <div id="result"></div>

    <script>
        function runAI() {
            let text = document.getElementById("userInput").value;
            if(text.trim() === "") {
                alert("Baraye meherbani kuch likhein!");
                return;
            }
            document.getElementById("result").innerHTML = "<b>AI ka Jawab:</b> Aap ka sawal mil gaya ('" + text + "'). Yeh bilkul free chal rahi hai!";
        }
    </script>

</body>
</html>
