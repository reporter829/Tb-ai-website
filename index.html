<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <title>Meri Real AI Website</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input { padding: 12px; width: 70%; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; }
        button { padding: 12px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 16px; color: #333; text-align: left; background: #e9ecef; padding: 15px; border-radius: 5px; min-height: 50px; white-space: pre-wrap; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 Meri Real AI Website</h1>
        <p>Apni API Key darj karein aur koi bhi sawal poochhein:</p>
        
        <input type="password" id="apiKeyInput" placeholder="Yahan apni Gemini API Key paste karein...">
        <br>
        <input type="text" id="userInput" placeholder="Apna sawal likhein...">
        <br><br>
        <button onclick="runAI()">Jawab Hasil Karein</button>

        <div id="result">Aap ka real AI jawab yahan aaye ga...</div>
    </div>

    <script>
        async function runAI() {
            let apiKey = document.getElementById("apiKeyInput").value.trim();
            let text = document.getElementById("userInput").value.trim();
            let resultDiv = document.getElementById("result");

            if(!apiKey) {
                alert("Baraye meherbani pehle apni Gemini API Key paste karein!");
                return;
            }
            if(!text) {
                alert("Baraye meherbani apna sawal likhein!");
                return;
            }

            resultDiv.innerHTML = "<b>AI soch raha hai... intezaar karein...</b>";

            try {
                let response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                let data = await response.json();

                if(data.error) {
                    resultDiv.innerHTML = "<b>Error:</b> " + data.error.message;
                } else if(data.candidates && data.candidates[0].content) {
                    let aiReply = data.candidates[0].content.parts[0].text;
                    resultDiv.innerHTML = "<b>AI ka Jawab:</b><br><br>" + aiReply;
                } else {
                    resultDiv.innerHTML = "<b>Error:</b> Unexpected response format from API.";
                }
            } catch (error) {
                resultDiv.innerHTML = "<b>Connection Error:</b> Internet ya API connection check karein.";
            }
        }
    </script>

</body>
</html>
